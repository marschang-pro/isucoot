<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e78">
  <title>報修登記</title>
  <link rel="stylesheet" href="style.css">
  <!-- supabase-js v2（固定版本，避免自動更新造成問題） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>報修登記</h1>
    <p class="subtitle">示範系統，請勿填寫真實姓名或個人資料。</p>
  </header>

  <main class="container">
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>

      <div id="message" class="message" role="status" aria-live="polite" hidden></div>

      <form id="repair-form" novalidate>
        <div class="field">
          <label for="reporter_name">報修人 <span class="req">*</span></label>
          <input id="reporter_name" name="reporter_name" type="text" maxlength="50" required autocomplete="name" placeholder="例：王小明">
        </div>

        <div class="field">
          <label for="location">地點或部門 <span class="req">*</span></label>
          <input id="location" name="location" type="text" maxlength="100" required placeholder="例：示範工地A區、資訊部">
        </div>

        <div class="field">
          <label for="category">類別 <span class="req">*</span></label>
          <select id="category" name="category" required>
            <option value="" selected disabled>請選擇</option>
            <option value="設備">設備</option>
            <option value="網路">網路</option>
            <option value="環境">環境</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="field">
          <label for="description">問題說明 <span class="req">*</span></label>
          <textarea id="description" name="description" rows="4" maxlength="1000" required placeholder="請描述發生了什麼問題"></textarea>
          <div class="hint"><span id="desc-count">0</span> / 1000 字</div>
        </div>

        <fieldset class="field">
          <legend>緊急程度</legend>
          <div class="segmented">
            <label><input type="radio" name="urgency" value="低"><span>低</span></label>
            <label><input type="radio" name="urgency" value="中" checked><span>中</span></label>
            <label><input type="radio" name="urgency" value="高"><span>高</span></label>
          </div>
        </fieldset>

        <button id="submit-btn" type="submit" class="btn-primary">送出報修</button>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">最近 20 筆報修</h2>
        <button id="refresh-btn" type="button" class="btn-secondary">重新整理</button>
      </div>
      <p id="list-status" class="list-status">載入中…</p>
      <ul id="repair-list" class="repair-list"></ul>
    </section>
  </main>
</body>
</html>
